[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
optimizer = true
optimizer_runs = 200
evm_version = "cancun"
solc = "0.8.26"

[rpc_endpoints]
robinhood = "${RPC_URL}"

[etherscan]
robinhood = {key = "${BLOCKSCOUT_API_KEY}", url = "https://robinhoodchain.blockscout.com/api", chain = 4663}
