[package]
name = "kerb"
version = "0.1.0"
description = "Kerb: wallet-to-wallet OTC desk for SPL tokens on Solana"
edition.workspace = true
rust-version.workspace = true

[lib]
crate-type = ["cdylib", "lib"]
name = "kerb"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]
anchor-debug = []
custom-heap = []
custom-panic = []

[dependencies]
anchor-lang = { version = "1.2.1", default-features = false, features = ["init-if-needed", "solana-v4"] }
anchor-spl = { version = "1.2.1", default-features = false, features = ["token", "token_2022", "associated_token", "mint", "solana-v4"] }

[dev-dependencies]
litesvm = "0.17.0"
solana-message = "4"
solana-transaction = "4"
solana-signer = "3"
solana-keypair = "3"
solana-account = "4"
solana-clock = "3"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
